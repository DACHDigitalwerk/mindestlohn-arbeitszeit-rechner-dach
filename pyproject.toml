[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "milog-dach"
version = "1.0.0"
description = "DACH Mindestlohn-, Mindestvergütungs- & Arbeitszeit-Prüfer 2026 (MiLoG § 17, ArbZG, AZG, ArG)"
readme = "README.md"
authors = [{ name = "DACH Digitalwerk", email = "dach.digitalwerk@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dach-milog = "milog_dach.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
